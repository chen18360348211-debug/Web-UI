name: Publish website to GitHub Pages

on:
  push:
    branches: [main, codex/publish-site]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  import-site:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v6
      - name: Import the uploaded website archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "mikolo-site-source.zip" --dir "$RUNNER_TEMP"
          echo "5989ec80bf76eeb8dc68ba73aebe7b576a8107c50ee8b6a2bb3eab228c1e787d  $RUNNER_TEMP/mikolo-site-source.zip" | sha256sum --check
          unzip -q -o "$RUNNER_TEMP/mikolo-site-source.zip" -d "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .gitignore design-qa.md dist package.json scripts source
          if ! git diff --cached --quiet; then
            git commit -m "Import complete MIKOLO website and original assets"
            git push origin HEAD:main
          fi
  deploy:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v6
      - name: Verify countdown
        if: hashFiles('dist/index.html') != ''
        run: node scripts/countdown.test.mjs
      - name: Configure GitHub Pages
        if: hashFiles('dist/index.html') != ''
        uses: actions/configure-pages@v5
      - name: Upload static website
        if: hashFiles('dist/index.html') != ''
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy website
        if: hashFiles('dist/index.html') != ''
        id: deployment
        uses: actions/deploy-pages@v4
